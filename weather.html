<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2137">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<title>طقس الشرقاط المباشر | المركز التفاعلي للخدمات الجوية</title>
<style>
:root{--gold:#f5b02e;--gold2:#ffd166;--muted:#cfe3ff;--line:rgba(255,255,255,.16);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{background:#0d2137}
body{margin:0;font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif;color:#fff;padding:14px 14px 24px;background:transparent;line-height:1.7}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.5)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 12px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:12px;min-width:0}
.title .ico{font-size:2.2rem;line-height:1;filter:drop-shadow(0 0 12px rgba(255,200,60,.6))}
h1{margin:0;font-size:clamp(1.05rem,3.4vw,1.7rem);font-weight:900;color:var(--gold2);line-height:1.35}
.ctrl{display:flex;gap:10px;align-items:center;flex-shrink:0}
.refresh{width:40px;height:40px;border:0;background:none;font-size:1.4rem;transition:transform .6s}
.refresh.spin{transform:rotate(360deg)}

.grid{display:grid;grid-template-columns:1fr 1.75fr;gap:14px;align-items:start}
.fc{order:1;padding:12px;border-radius:18px;background:linear-gradient(180deg,#12304f,#0e2540);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.current{order:2;padding:6px 0;min-height:340px;display:flex;flex-direction:column;justify-content:space-between}
.live{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:#22e05a;box-shadow:0 0 10px #22e05a;animation:pulse 1.4s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.alert{margin:10px 0 0;padding:10px 12px;border-inline-start:4px solid #ff6b5e;background:rgba(160,30,24,.45);border-radius:8px;font-weight:700;font-size:.9rem;line-height:1.8}
.cur-main{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.city{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:900;margin:0;line-height:1.25}
.date{font-weight:600;color:var(--muted);font-size:.85rem}
.big{display:flex;align-items:center;gap:12px}
.hero{width:clamp(2.8rem,9vw,5rem);height:clamp(2.8rem,9vw,5rem);display:grid;place-items:center;font-size:clamp(2.4rem,8vw,4.2rem);line-height:1;filter:drop-shadow(0 0 20px rgba(255,255,255,.4));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sun{position:relative;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc61a 55%,#f59e0b);box-shadow:0 0 40px 12px rgba(255,200,40,.7)}
.sun::before{content:"";position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(rgba(255,220,80,.5) 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.temp{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:900;line-height:1;direction:ltr}
.desc{font-size:clamp(1.05rem,3vw,1.3rem);font-weight:900;color:var(--gold2);text-align:end}
.feels{text-align:end;font-weight:600;margin-top:2px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;border-top:1px solid var(--line);padding:12px 0 0}
.stat{text-align:center;padding:4px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat .i{font-size:1.4rem}
.stat .t{font-weight:700;font-size:.78rem}
.stat .v{font-weight:800;font-size:.9rem}
.fc h2{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:1.05rem;font-weight:900}

/* ===== بطاقات التوقعات ===== */
#fcList{display:flex;flex-direction:column;gap:6px}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.18);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.row>*{position:relative;z-index:1}
.row .ic{font-size:1.7rem;width:40px;text-align:center;line-height:1}
.row .d{flex:1;min-width:0;line-height:1.45}
.row .d b{display:block;font-weight:900;font-size:.95rem}
.row .d span{font-size:.78rem;color:#e6f0ff}
.row .tp{direction:ltr;font-weight:900;font-size:1rem;white-space:nowrap}
.hi{color:#ffe08a}.lo{color:#bfe0ff}

.r-sunny{background:
  radial-gradient(circle at 14% 35%,#fffbd0 0 6%,rgba(255,214,90,.95) 7% 14%,rgba(255,190,60,.35) 15% 30%,transparent 46%),
  linear-gradient(120deg,#1c6fc0 0%,#3b9be6 55%,#7cc5f5 100%)}
.r-partly{background:
  radial-gradient(circle at 12% 30%,rgba(255,236,150,.95) 0 8%,rgba(255,200,70,.35) 9% 26%,transparent 42%),
  radial-gradient(ellipse 22% 38% at 34% 66%,rgba(255,255,255,.55),transparent 70%),
  radial-gradient(ellipse 26% 42% at 62% 40%,rgba(255,255,255,.42),transparent 70%),
  radial-gradient(ellipse 20% 36% at 86% 70%,rgba(255,255,255,.4),transparent 70%),
  linear-gradient(120deg,#2f78bd,#6aa9dc)}
.r-cloudy{background:
  radial-gradient(ellipse 24% 44% at 18% 62%,rgba(255,255,255,.4),transparent 70%),
  radial-gradient(ellipse 28% 46% at 46% 34%,rgba(255,255,255,.34),transparent 70%),
  radial-gradient(ellipse 24% 44% at 74% 66%,rgba(255,255,255,.36),transparent 70%),
  radial-gradient(ellipse 20% 38% at 94% 34%,rgba(255,255,255,.3),transparent 70%),
  linear-gradient(120deg,#52677f,#7d92a8)}
.r-rain{background:
  repeating-linear-gradient(105deg,rgba(190,220,255,.32) 0 1.2px,transparent 1.2px 11px),
  repeating-linear-gradient(105deg,rgba(190,220,255,.2) 0 1px,transparent 1px 17px) 6px 5px,
  radial-gradient(ellipse 28% 40% at 22% 14%,rgba(30,40,60,.55),transparent 75%),
  radial-gradient(ellipse 30% 40% at 62% 10%,rgba(30,40,60,.5),transparent 75%),
  linear-gradient(120deg,#26384f,#3c556f)}
.r-wind{background:
  linear-gradient(90deg,transparent 4%,rgba(255,255,255,.4) 5% 31%,transparent 32%) 0 22%/100% 2px no-repeat,
  linear-gradient(90deg,transparent 22%,rgba(255,255,255,.35) 23% 60%,transparent 61%) 0 46%/100% 2px no-repeat,
  linear-gradient(90deg,transparent 42%,rgba(255,255,255,.4) 43% 88%,transparent 89%) 0 70%/100% 2px no-repeat,
  linear-gradient(120deg,#1f7f86,#4fb3b6)}
.r-dust{background:
  repeating-linear-gradient(0deg,rgba(255,220,150,.14) 0 3px,transparent 3px 9px),
  linear-gradient(120deg,#8a5a2b,#c9955a)}
.r-snow{background:
  radial-gradient(circle,rgba(255,255,255,.9) 0 1.6px,transparent 2.2px) 0 0/22px 22px,
  radial-gradient(circle,rgba(255,255,255,.6) 0 1.2px,transparent 1.8px) 11px 11px/22px 22px,
  linear-gradient(120deg,#5f7d9c,#a9c1d8)}

.note{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:8px}
.banner{text-align:center;padding:12px 0 0;border-top:1px solid var(--line)}
.banner .pill{font-weight:800;font-size:.9rem;margin-bottom:6px}
.banner .by{font-family:"Aref Ruqaa",Tahoma,Arial,sans-serif;font-weight:700;color:var(--gold2);font-size:1.45rem;line-height:1.9;letter-spacing:0;text-shadow:0 2px 10px rgba(0,0,0,.55),0 0 14px rgba(255,209,102,.35)}

/* ===== الساعة الإلكترونية ===== */
.digital-clock{flex-shrink:0;min-width:112px;padding:8px 10px;border-radius:14px;background:linear-gradient(180deg,#0b121b,#05090f);border:2px solid var(--gold);box-shadow:0 0 15px rgba(245,176,46,.3),inset 0 0 10px rgba(0,0,0,.8);text-align:center;text-shadow:0 0 10px rgba(255,209,102,.6);font-family:inherit;font-variant-numeric:tabular-nums;line-height:1.25}
.dc-main{display:flex;align-items:baseline;justify-content:center;gap:5px;color:var(--gold2);font-weight:900}
#dcHM{font-size:1.7rem;font-weight:900;line-height:1.1}
.dc-s{font-size:.95rem;font-weight:800;color:#ff6b5e;min-width:1.3em}
.dc-ap{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:2px}

@media(max-width:850px){.grid{grid-template-columns:1fr}.current{order:1;min-height:0}.fc{order:2}}
@media(max-width:600px){
  body{padding:10px 10px 18px}
  .wrap{gap:10px}
  .digital-clock{min-width:92px;padding:6px 8px}
  #dcHM{font-size:1.4rem}
  .stat .t{font-size:.72rem}.stat .v{font-size:.8rem}
}
@media(prefers-reduced-motion:reduce){.dot,.hero,.sun::before{animation:none}.refresh{transition:none}}

/* ===== تحسين وضوح الكتابات ===== */
:root{--muted:#eaf3ff}
.wrap{text-shadow:0 0 3px rgba(0,0,0,.85),0 1px 10px rgba(0,0,0,.75)}
.row{text-shadow:0 1px 3px rgba(0,0,0,.8)}
h1{color:#ffe08a}
.fc h2{font-size:1.15rem}
.live{font-size:.95rem}
.date{font-size:.95rem;font-weight:700;color:#eaf3ff}
.feels{font-size:.95rem;font-weight:800}
.alert{font-size:1rem;color:#fff;background:rgba(150,20,15,.72)}
.stat .t{font-size:.85rem;font-weight:800}
.stat .v{font-size:1rem;font-weight:900}
.row .d b{font-size:1.05rem}
.row .d span{font-size:.88rem;font-weight:700;color:#fff}
.row .tp{font-size:1.1rem}
.hi{color:#ffe28a}.lo{color:#d3ebff}
.note{font-size:.88rem;font-weight:700;color:#eaf3ff}
.banner .pill{font-size:1rem}
.banner .by{text-shadow:0 0 4px rgba(0,0,0,.9),0 2px 12px rgba(0,0,0,.7),0 0 14px rgba(255,209,102,.35)}
.dc-ap{color:#eaf3ff;font-weight:800}
@media(max-width:600px){
  .stat .t{font-size:.78rem}
  .stat .v{font-size:.9rem}
  .row .d span{font-size:.82rem}
}

/* ===== ضغط المسافات ===== */
body{line-height:1.4;padding:8px 10px 12px}
.wrap{gap:8px}
header{padding:0 0 6px}
.grid{gap:8px}
.fc{padding:6px 8px}
.fc h2{margin:0 0 4px;padding-bottom:3px}
#fcList{gap:2px}
.row{min-height:0;padding:1px 10px;gap:8px;border-radius:12px}
.row .ic{font-size:1.3rem;width:32px;line-height:1}
.row .d{line-height:1.05}
.row .d b{line-height:1.1}
.row .d span{line-height:1.1}
.note{margin-top:3px}
.current{min-height:0;padding:2px 0}
.alert{margin:6px 0 0;padding:6px 10px;line-height:1.5}
.cur-main{margin:6px 0}
.city{line-height:1.15}
.stats{margin-top:8px;padding:6px 0 0}
.stat{padding:2px}
.stat .i{font-size:1.2rem;line-height:1.3}
.banner{padding:4px 0 0}
.banner .pill{margin-bottom:2px}
.banner .by{line-height:1.35}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <div class="title"><div class="ico">🌤️</div><div><h1>طقس الشرقاط المباشر</h1></div></div>
    <div class="ctrl">
      <div class="digital-clock" id="digitalClock" title="الوقت الحالي بتوقيت بغداد" dir="ltr">
        <div class="dc-main"><span id="dcHM">--:--</span><span class="dc-s" id="dcS">--</span></div>
        <div class="dc-ap" id="dcAP"></div>
      </div>
      <button class="refresh" id="ref" type="button" title="تحديث البيانات" aria-label="تحديث البيانات">↻</button>
    </div>
  </header>

  <div class="grid">
    <aside class="fc">
      <h2>📅 توقعات الـ 5 أيام القادمة</h2>
      <div id="fcList"></div>
      <div class="note">🕒 تتحدث البيانات تلقائياً كل 10 دقائق</div>
    </aside>
    <section class="current" aria-live="polite">
      <div>
        <span class="live"><span class="dot" id="liveDot"></span> <span id="liveTxt">جارٍ التحميل…</span></span>
        <div class="alert" id="alert" role="alert" hidden></div>
        <div class="cur-main">
          <div><h2 class="city" id="cityName">الشرقاط</h2><div class="date" id="date"></div></div>
          <div class="big"><div class="hero" id="hero"></div><div class="temp" id="temp">--°C</div></div>
        </div>
        <div class="desc" id="desc">...</div>
        <div class="feels" id="feels"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="i">☀️</div><div class="t">مؤشر UV</div><div class="v" id="uv">--</div></div>
        <div class="stat"><div class="i">🧭</div><div class="t">الضغط</div><div class="v" id="pr">--</div></div>
        <div class="stat"><div class="i">💧</div><div class="t">الرطوبة</div><div class="v" id="hu">--</div></div>
        <div class="stat"><div class="i">🌬️</div><div class="t">الرياح</div><div class="v" id="wi">--</div></div>
      </div>
    </section>
  </div>

  <div class="banner">
    <div class="pill">مرحباً بكم في بوابتنا الشاملة</div>
    <div class="by">تصميم واعداد محمد علي احمد الحطاب الجبوري</div>
    <a href="https://mhamalgporee-ctrl.github.io/" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;padding:8px 18px;border-radius:999px;background:#f5b02e;color:#0d2137;font-weight:900;text-decoration:none;text-shadow:none">اضغط هنا لمعاينة الموقع</a>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LAT=35.52,LON=43.25,TZ="Asia/Baghdad";
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const THUNDER=[95,96,99];
const RAIN=[51,53,55,56,57,61,63,65,66,67,80,81,82];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const city="الشرقاط";
let S=null,mode="sunny",curKey="",lastOk=0,thunderSoon=false,retryTimer=0;

/* ===== الساعة الإلكترونية بتوقيت بغداد ===== */
const clockFmt=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",hour:"numeric",minute:"numeric",second:"numeric",day:"numeric"});
function updateClock(){
  const p={};
  clockFmt.formatToParts(new Date()).forEach(x=>{p[x.type]=x.value});
  const h=Number(p.hour)%24,m=Number(p.minute),s=Number(p.second);
  const h12=h%12||12,pad=v=>String(v).padStart(2,"0");
  $("dcHM").textContent=pad(h12)+":"+pad(m);
  $("dcS").textContent=pad(s);
  $("dcAP").textContent=h<12?"صباحاً":"مساءً";
}
setInterval(updateClock,1000);updateClock();

/* ===== رموز الطقس ===== */
function wx(c){ // [icon, desc, fx]
  if(c===0)return["☀️","مشمس","sunny"];
  if(c<=2)return["⛅","غائم جزئياً","cloudy"];
  if(c===3)return["☁️","غائم","cloudy"];
  if(c<=48)return["🌫️","ضباب","cloudy"];
  if(c<=57)return["🌦️","رذاذ خفيف","rain"];
  if(c<=67||(c>=80&&c<=82))return["🌧️","أمطار","rain"];
  if(c<=77||c===85||c===86)return["❄️","ثلوج","cloudy"];
  return["⛈️","عواصف رعدية","rain"];
}
function kind(c){
  if(c===0)return"sunny";
  if(c<=2)return"partly";
  if(c<=48)return"cloudy";
  if(c<=67||(c>=80&&c<=82))return"rain";
  if(c<=77||c===85||c===86)return"snow";
  return"rain";
}
const uvTxt=u=>u<3?"منخفض":u<6?"معتدل":u<8?"مرتفع":u<11?"مرتفع جداً":"شديد";

/* ===== تصحيح حالة السماء بما يتوافق مع واقع الشرقاط ===== */
function effCloud(l,m){
  // نعتمد على الغيوم المنخفضة والمتوسطة فقط، ونهمل الغيوم العالية الرقيقة لأنها لا تحجب الشمس
  return Math.min(100,Math.max(l||0,m||0));
}
function fixCode(code,eff){
  if(code>3)return code;   // الضباب والأمطار والعواصف تبقى كما هي
  if(eff<40)return 0;      // أقل من 40%: السماء صافية عملياً (غيوم قليلة لا تحجب الشمس)
  if(eff<75)return 2;      // غائم جزئياً
  return 3;                // غائم
}

/* ===== تنبيه جوي ===== */
function vals(h,n){const o=[];if(!h)return o;Object.keys(h).forEach(k=>{if(k===n||k.startsWith(n+"_"))(h[k]||[]).forEach(v=>o.push(v))});return o}
function buildAlert(c,h){
  const num=v=>typeof v==="number"&&!Number.isNaN(v);
  const codes=[...vals(h,"weather_code"),c.weather_code];
  const prec=[...vals(h,"precipitation"),c.precipitation||0].filter(num);
  const gust=[...vals(h,"wind_gusts_10m"),c.wind_gusts_10m||0].filter(num);
  const cape=vals(h,"cape").filter(num);
  const mg=gust.length?Math.max(...gust):0,mc=cape.length?Math.max(...cape):0;
  const wet=codes.some(x=>RAIN.includes(x))||prec.some(p=>p>.1);
  const thunder=codes.some(x=>THUNDER.includes(x));
  const maybeT=!thunder&&(mc>=1500||(mc>=800&&wet));
  thunderSoon=thunder;
  const parts=[];
  if(thunder)parts.push("⚡ عواصف رعدية وبرق");else if(maybeT)parts.push("⚡ احتمال عواصف رعدية وبرق");
  if(wet)parts.push("🌧️ أمطار");
  if(mg>=65)parts.push(`💨 رياح عاصفة (هبات حتى ${Math.round(mg)} كم/س)`);
  else if(mg>=45)parts.push(`💨 رياح قوية (هبات حتى ${Math.round(mg)} كم/س)`);
  return parts.length?"تنبيه جوي خلال الساعات القريبة: "+parts.join(" · "):"";
}

/* ===== تحميل البيانات ===== */
function offlineState(){
  const d=new Date();d.setHours(6,0,0,0);const sr=+d;d.setHours(17,15,0,0);
  return{off:1,cc:0,code:0,t:0,precip:0,now0:Date.now(),at:Date.now(),sr,ss:+d,daily:[],dn:[],dust:0,w:0,h:0,p:0,uv:0,f:0}
}
async function load(){
  clearTimeout(retryTimer);
  const base=`latitude=${LAT}&longitude=${LON}&timezone=Asia%2FBaghdad`;
  const cur="temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,pressure_msl,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,uv_index,is_day";
  const dly="weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,wind_speed_10m_max,precipitation_probability_max";
  try{
    const [rw,ra,rm]=await Promise.allSettled([
      fetch(`https://api.open-meteo.com/v1/forecast?${base}&current=${cur}&daily=${dly}&forecast_days=6`),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${base}&current=dust`),
      fetch(`https://api.open-meteo.com/v1/forecast?${base}&hourly=weather_code,precipitation,wind_gusts_10m,cape&models=best_match,icon_seamless,gfs_seamless&past_hours=3&forecast_hours=6`)]);
    if(rw.status!=="fulfilled"||!rw.value.ok)throw 0;
    const d=await rw.value.json(),c=d.current,dl=d.daily;
    let dust=0;try{dust=(await ra.value.json()).current.dust||0}catch(e){}
    let hourly=null;try{hourly=(await rm.value.json()).hourly}catch(e){}
    const eff=effCloud(c.cloud_cover_low,c.cloud_cover_mid);
    const hasLayers=typeof c.cloud_cover_low==="number"||typeof c.cloud_cover_mid==="number";
    const correctedCode=hasLayers?fixCode(c.weather_code,eff):c.weather_code;

    S={t:Math.round(c.temperature_2m),f:Math.round(c.apparent_temperature),w:Math.round(c.wind_speed_10m),h:c.relative_humidity_2m,p:Math.round(c.pressure_msl),uv:Math.round(c.uv_index),
      cc:correctedCode===0?0:(hasLayers?eff:c.cloud_cover),
      precip:c.precipitation||0,dust,
      code:correctedCode,
      now0:Date.parse(c.time),at:Date.now(),sr:Date.parse(dl.sunrise[0]),ss:Date.parse(dl.sunset[0]),
      daily:[1,2,3,4,5].map(i=>[dl.weather_code[i],Math.round(dl.temperature_2m_max[i]),Math.round(dl.temperature_2m_min[i]),dl.wind_speed_10m_max[i],dl.precipitation_probability_max[i]]),
      dn:[1,2,3,4,5].map(i=>new Date(dl.time[i]+"T12:00:00").getDay())};
    S.alert=buildAlert(c,hourly);
    lastOk=Date.now();
  }catch(e){
    if(S&&!S.off){S.stale=true;retryTimer=setTimeout(load,60000)}
    else{S=offlineState();retryTimer=setTimeout(load,30000)}
  }
  render();
}

/* ===== العرض ===== */
function liveFx(){
  if(S.dust>=150||(S.w>=40&&S.h<30))return"dust";
  if(S.precip>.1&&S.code<=3)return"rain";
  return wx(S.code)[2];
}
function fi(x){
  const w=wx(x[0]);
  if(x[3]>=35&&x[0]<=3)return["🌬️","نشاط للرياح","wind"];
  if(x[4]>=50&&w[2]!=="rain")return["🌧️","فرصة أمطار","rain"];
  return[w[0],w[1],kind(x[0])];
}
function render(){
  $("cityName").textContent=city;
  const n=new Date(S.now0+(Date.now()-S.at));
  $("date").textContent=DAYS[n.getDay()]+"، "+n.getDate()+" "+MONS[n.getMonth()]+" "+n.getFullYear();
  const al=$("alert");
  if(S.off){
    $("temp").textContent="--°C";$("feels").textContent="";
    $("wi").textContent=$("hu").textContent=$("pr").textContent=$("uv").textContent="--";
    $("fcList").innerHTML='<div class="note">لا توجد توقعات متاحة الآن.</div>';
    $("liveTxt").textContent="تعذّر الاتصال بخدمة الطقس · سنعيد المحاولة تلقائياً";
    $("liveDot").style.background="#999";$("liveDot").style.boxShadow="none";
    $("desc").textContent="الطقس غير متاح الآن";
    al.hidden=true;
  }else{
    $("temp").textContent=S.t+"°C";
    $("feels").textContent="الحرارة المحسوسة: "+S.f+"°C";
    $("wi").textContent=S.w+" كم/س";$("hu").textContent=S.h+"%";$("pr").textContent=S.p+" hPa";
    $("uv").textContent=S.uv+" ("+uvTxt(S.uv)+")";
    $("fcList").innerHTML=S.daily.map((x,i)=>{const w=fi(x);
      return `<div class="row r-${w[2]}"><div class="ic">${w[0]}</div><div class="d"><b>${DAYS[S.dn[i]]}</b><span>${w[1]}</span></div><div class="tp"><span class="hi">${x[1]}°</span> / <span class="lo">${x[2]}°</span></div></div>`}).join("");
    if(S.stale){
      const m=Math.max(1,Math.round((Date.now()-lastOk)/60000));
      $("liveTxt").textContent="تعذّر التحديث · آخر بيانات قبل "+m+" دقيقة";
      $("liveDot").style.background="#f5b02e";$("liveDot").style.boxShadow="none";
    }else{
      $("liveTxt").textContent="تحديث مباشر الآن";
      $("liveDot").style.background="";$("liveDot").style.boxShadow="";
    }
    al.textContent=S.alert||"";al.hidden=!S.alert;
  }
  setFx(liveFx());
  if(reduce)draw(performance.now());
}
function cover(){const c=(S.cc??0)/100;return mode==="dust"?.5:mode==="rain"?Math.max(.9,c):c}
function setFx(fx){
  mode=fx;
  const night=sky().a<0;
  if(!S.off){
    const w=wx(S.code);let icon=w[0],desc=w[1];
    if(fx==="dust"){icon="🌪️";desc="عاصفة ترابية"}
    else if(fx==="rain"&&w[2]!=="rain"){icon="🌧️";desc="أمطار"}
    else if(fx==="sunny"){icon=night?"🌙":"☀️";desc=night?(S.t<20?"ليل صاف وبارد":"ليل صاف"):(S.t>=25?"مشمس ودافئ":"مشمس صاف")}
    else if(night&&icon==="⛅")icon="☁️";
    $("desc").textContent=desc;
    $("hero").innerHTML=(fx==="sunny"&&!night)?'<div class="sun"></div>':icon;
  }else{
    $("hero").innerHTML=night?"🌙":'<div class="sun"></div>';
  }
  const key=fx+Math.round(cover()*5);
  if(key!==curKey||!CL.length){curKey=key;initScene()}
}

/* ===== المشهد ===== */
const cv=$("fx"),cx=cv.getContext("2d");let W=1,H=1,P=[],CL=[],ST=[],flash=0;
const KS=[[-1,[5,10,26],[12,22,52]],[-.25,[10,18,45],[30,40,85]],[0,[60,60,120],[240,130,80]],[.15,[60,110,180],[250,190,120]],[.5,[30,100,180],[130,195,240]],[1,[20,100,190],[150,215,255]]];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),cl01=v=>Math.max(0,Math.min(1,v));
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function pal(a){a=Math.max(-1,Math.min(1,a));let i=0;while(i<KS.length-2&&a>KS[i+1][0])i++;const k0=KS[i],k1=KS[i+1],t=(a-k0[0])/(k1[0]-k0[0]);return[mix(k0[1],k1[1],t),mix(k0[2],k1[2],t)]}
function sky(){
  const now=S.now0+(Date.now()-S.at),f=(now-S.sr)/(S.ss-S.sr);
  let a,day=f>=0&&f<=1,pos=f;
  if(day)a=Math.sin(Math.PI*f);
  else{const nl=(S.sr+864e5)-S.ss;pos=cl01(f>1?(now-S.ss)/nl:(now-(S.ss-864e5))/nl);a=-Math.sin(Math.PI*pos)}
  return{a,day,pos};
}
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function initScene(){
  size();P=[];
  const n={rain:260,dust:150}[mode]||0;
  for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,s:Math.random(),r:Math.random()});
  ST=[];for(let i=0;i<170;i++)ST.push({x:Math.random()*W,y:Math.random()*H*.7,s:Math.random(),r:Math.random()*20});
  CL=[];const k=Math.round(cover()*10); // السماء الصافية = لا غيوم مرسومة
  for(let i=0;i<k;i++){const sc=.6+Math.random()*1.1,m=7+Math.floor(Math.random()*5),pf=[];
    for(let j=0;j<m;j++){const u=j/(m-1)-.5;pf.push({dx:u*190*sc+(Math.random()-.5)*26,dy:(Math.random()-.5)*16*sc-(1-Math.abs(u)*2)*20*sc,r:(32+Math.random()*28)*sc*(1-Math.abs(u)*.5)})}
    CL.push({x:Math.random()*(W+500)-250,y:H*(.05+Math.random()*.5),v:.12+Math.random()*.3,pf})}
}
function draw(t){
  const{a,day,pos}=sky(),cov=cover();
  let[top,bot]=pal(a);
  const gray=mode==="rain"?.7:mode==="cloudy"?.45:0,lum=(top[0]+top[1]+top[2])/3;
  if(gray){top=mix(top,[lum*.8,lum*.85,lum*.95],gray);bot=mix(bot,[lum*1.15,lum*1.2,lum*1.25],gray)}
  if(mode==="dust"){top=mix(top,[150,100,50],.55);bot=mix(bot,[220,160,90],.65)}
  const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  const sa=cl01(-a*3)*(1-cov*.75);
  if(sa>0)ST.forEach(s=>{cx.fillStyle=`rgba(255,255,255,${sa*(.3+.7*Math.abs(Math.sin(t/900+s.r)))})`;cx.beginPath();cx.arc(s.x,s.y,.5+s.s*1.2,0,7);cx.fill()});
  const hy=H*.7,px=W*(.12+.76*pos),py=hy-Math.sin(Math.PI*pos)*H*.48,vis=1-cov*.6;
  if(day){
    const warm=cl01(1-a*3),c=mix([255,245,205],[255,140,60],warm);
    let g=cx.createRadialGradient(px,py,0,px,py,H*.55);g.addColorStop(0,rgb(c,.55*vis));g.addColorStop(.25,rgb(c,.2*vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.fillRect(0,0,W,H);
    g=cx.createRadialGradient(px,py,0,px,py,38);g.addColorStop(0,rgb([255,255,240],vis));g.addColorStop(.7,rgb(c,vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.beginPath();cx.arc(px,py,38,0,7);cx.fill();
  }else{
    let g=cx.createRadialGradient(px,py,0,px,py,H*.3);g.addColorStop(0,`rgba(190,205,255,${.3*vis})`);g.addColorStop(1,"rgba(190,205,255,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.globalAlpha=vis;cx.fillStyle="#f1f1e6";cx.beginPath();cx.arc(px,py,26,0,7);cx.fill();
    cx.fillStyle="rgba(150,150,140,.35)";[[-8,-6,6],[7,4,8],[-4,11,4],[10,-9,3.5]].forEach(q=>{cx.beginPath();cx.arc(px+q[0],py+q[1],q[2],0,7);cx.fill()});cx.globalAlpha=1;
  }
  let cc=mix([70,80,120],[255,255,255],cl01((a+.3)/.8));
  const tw=cl01(1-Math.abs(a-.05)/.25);cc=mix(cc,[255,185,150],tw*.6);
  if(gray)cc=mix(cc,[110,120,138],gray);
  if(mode==="dust")cc=mix(cc,[215,165,100],.6);
  const al=.5+.35*cov;
  CL.forEach(c=>{if(!reduce){c.x+=c.v;if(c.x>W+260)c.x=-260}
    c.pf.forEach(q=>{const x=c.x+q.dx,y=c.y+q.dy,g=cx.createRadialGradient(x,y,0,x,y,q.r);
      g.addColorStop(0,rgb(cc,al));g.addColorStop(.55,rgb(cc,al*.55));g.addColorStop(1,rgb(cc,0));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,q.r,0,7);cx.fill()})});
  if(mode==="dust"){cx.fillStyle="rgba(200,140,70,.18)";cx.fillRect(0,0,W,H);
    P.forEach(p=>{cx.fillStyle=`rgba(210,150,80,${.15+p.s*.3})`;cx.beginPath();cx.ellipse(p.x,p.y,10+p.r*26,1.5+p.r*2.5,0,0,7);cx.fill();if(!reduce){p.x-=3+p.s*7;p.y+=Math.sin(t/700+p.r*9)*.6;if(p.x<-40){p.x=W+40;p.y=Math.random()*H}}})}
  if(mode==="rain"){
    cx.strokeStyle="rgba(190,220,255,.5)";cx.lineWidth=1.2;cx.beginPath();
    P.forEach(p=>{cx.moveTo(p.x,p.y);cx.lineTo(p.x-3,p.y+14+p.s*10);if(!reduce){p.y+=9+p.s*9;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W}}});cx.stroke();
    if(!reduce&&(THUNDER.includes(S.code)||thunderSoon)){
      if(Math.random()<.0025)flash=1;
      if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,W,H);flash-=.06}
    }
  }
}

/* ===== حلقة الرسم ===== */
let raf=0,onScreen=true;
function loop(t){if(S)draw(t);raf=requestAnimationFrame(loop)}
function startLoop(){if(!raf&&!reduce&&onScreen&&!document.hidden)raf=requestAnimationFrame(loop)}
function stopLoop(){cancelAnimationFrame(raf);raf=0}
if("IntersectionObserver" in window)new IntersectionObserver(es=>{onScreen=es[0].isIntersecting;onScreen?startLoop():stopLoop()}).observe(document.querySelector(".wrap"));
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopLoop();else{startLoop();load()}});
addEventListener("resize",()=>{size();if(reduce&&S)draw(performance.now())});

/* ===== إرسال الارتفاع للصفحة الأم ===== */
let lastH=0;
function postHeight(){
  if(parent===window)return;
  const w=document.querySelector(".wrap"),cs=getComputedStyle(document.body);
  const h=Math.ceil(w.getBoundingClientRect().height+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom));
  if(Math.abs(h-lastH)>2){lastH=h;parent.postMessage({wxHeight:h},"*")}
}
if("ResizeObserver" in window)new ResizeObserver(postHeight).observe(document.querySelector(".wrap"));
addEventListener("load",postHeight);

$("ref").addEventListener("click",()=>{const r=$("ref");r.classList.add("spin");setTimeout(()=>r.classList.remove("spin"),600);load()});
setInterval(load,10*60*1000);
load();startLoop();

/* ===== Service Worker ===== */
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
