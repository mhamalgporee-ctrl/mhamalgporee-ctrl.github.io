<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2137">
<title>طقس الشرقاط المباشر | المركز التفاعلي للخدمات الجوية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5b02e;--gold2:#ffd166;--muted:#cfe3ff;--card:rgba(10,28,52,.62);--line:rgba(255,255,255,.16);--sky1:#1e5a9c;--sky2:#3a8bd6;--sky3:#0f2f5a;--cloud:rgba(255,255,255,.8);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Cairo',Tahoma,sans-serif;color:#fff;padding:16px 14px 130px;background:linear-gradient(180deg,var(--sky3),var(--sky1) 45%,var(--sky2));background-attachment:fixed}
body[data-fx=cloudy]{--sky1:#4a6788;--sky2:#8aa2bd;--sky3:#2b3f5a;--cloud:rgba(235,242,250,.85)}
body[data-fx=rain]{--sky1:#2c4259;--sky2:#506a85;--sky3:#16222f;--cloud:rgba(120,140,160,.85)}
body[data-fx=dust]{--sky1:#8a5a24;--sky2:#d09342;--sky3:#4b2f12;--cloud:rgba(220,170,100,.7)}
body[data-fx=night]{--sky1:#0b1430;--sky2:#1b2a5c;--sky3:#050a1a;--cloud:rgba(120,130,170,.3)}
button,select{font:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cl{position:fixed;left:-40vw;border-radius:50%;background:var(--cloud);filter:blur(16px);z-index:0;pointer-events:none;animation:drift linear infinite}
@keyframes drift{to{transform:translateX(175vw)}}
.scene{position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:0;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px}
.title{display:flex;align-items:center;gap:14px;min-width:0}
.title .ico{font-size:3rem;line-height:1;filter:drop-shadow(0 0 12px rgba(255,200,60,.6))}
h1{margin:0;font-size:clamp(1.2rem,4vw,2.1rem);font-weight:900;color:var(--gold2)}
.title p{margin:2px 0 0;font-size:.85rem;font-weight:600}
.ctrl{display:flex;gap:10px;align-items:center}
select{background:rgba(8,24,46,.85);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;min-width:190px}
.refresh{width:46px;height:46px;border-radius:12px;background:rgba(8,24,46,.85);border:1px solid var(--line);font-size:1.4rem;transition:transform .6s}
.refresh.spin{transform:rotate(360deg)}
.fxbar{display:flex;align-items:center;gap:10px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.fxbar::-webkit-scrollbar{display:none}
.fxbar .lbl{font-weight:800;white-space:nowrap;flex-shrink:0}
.fxbar button{white-space:nowrap;flex-shrink:0;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;background:rgba(8,24,46,.7);border:1.5px solid}
.fxbar button[data-fx=sunny]{border-color:#f5b02e}.fxbar button[data-fx=cloudy]{border-color:#9db4d4}.fxbar button[data-fx=rain]{border-color:#3b9cff}.fxbar button[data-fx=dust]{border-color:#d0763a}.fxbar button[data-fx=night]{border-color:#7b6cf0}
.fxbar button.on{background:rgba(255,255,255,.2);box-shadow:0 0 14px rgba(255,255,255,.35)}
.grid{display:grid;grid-template-columns:1fr 1.75fr;gap:14px}
.current{order:2;padding:20px;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.live{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:rgba(8,24,46,.75);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.8rem;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:#22e05a;box-shadow:0 0 10px #22e05a;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.cur-main{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.city{font-size:clamp(1.9rem,7vw,3.4rem);font-weight:900;margin:0}
.date{font-weight:600;color:var(--muted)}
.big{display:flex;align-items:center;gap:18px}
.hero{width:clamp(3.4rem,12vw,7rem);height:clamp(3.4rem,12vw,7rem);display:grid;place-items:center;font-size:clamp(3rem,10vw,6rem);line-height:1;filter:drop-shadow(0 0 20px rgba(255,255,255,.4));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sun{position:relative;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc61a 55%,#f59e0b);box-shadow:0 0 40px 12px rgba(255,200,40,.7)}
.sun::before{content:"";position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(rgba(255,220,80,.5) 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.temp{font-size:clamp(3rem,11vw,6.5rem);font-weight:900;line-height:1;direction:ltr}
.desc{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:900;color:var(--gold2);text-align:end}
.feels{text-align:end;font-weight:600;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;background:rgba(8,24,46,.62);border:1px solid var(--line);border-radius:18px;padding:14px 4px}
.stat{text-align:center;padding:4px;border-inline-start:1px solid var(--line)}.stat:first-child{border-inline-start:0}
.stat .i{font-size:1.5rem}.stat .t{font-weight:700;font-size:.9rem}.stat .v{font-weight:800;font-size:1.05rem}
.fc{order:1;padding:18px}
.fc h2{margin:0 0 14px;font-size:1.15rem;font-weight:900}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;background:rgba(8,24,46,.55);border:1px solid var(--line);border-radius:14px}
.row .ic{font-size:2rem;width:48px;text-align:center}.row .d{flex:1}.row .d b{display:block;font-weight:900}.row .d span{font-size:.8rem;color:var(--muted)}
.row .tp{direction:ltr;font-weight:900;font-size:1.05rem}.hi{color:var(--gold2)}.lo{color:#7ab8ff}
.note{font-size:.8rem;color:var(--muted);font-weight:600}
.banner{text-align:center;padding:14px;border:1.5px solid var(--gold);box-shadow:0 0 18px rgba(245,176,46,.25)}
.banner .pill{display:inline-block;background:rgba(8,24,46,.8);border:1px solid var(--gold);border-radius:999px;padding:6px 22px;font-weight:800;margin-bottom:8px}
.banner .by{font-weight:900;color:var(--gold2)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.current{order:1}.fc{order:2}}
@media(max-width:600px){body{padding:10px 8px 120px}.wrap{gap:10px}header{padding:10px 12px}.title{width:100%;gap:8px}.title .ico{font-size:2rem}.title p{font-size:.68rem}.ctrl{width:100%}select{min-width:0;flex:1;padding:8px 10px;font-size:.8rem}.refresh{width:40px;height:40px;font-size:1.1rem}.fxbar{padding:8px 10px;gap:8px}.fxbar .lbl{font-size:.75rem}.fxbar button{padding:7px 12px;font-size:.78rem}.current{padding:14px;min-height:0}.date{font-size:.8rem}.big{gap:6px}.feels{font-size:.8rem}.stats{padding:10px 2px;margin-top:12px}.stat .i{font-size:1.1rem}.stat .t{font-size:.65rem}.stat .v{font-size:.7rem}.fc{padding:12px}.row{padding:8px 10px}.row .ic{font-size:1.5rem;width:36px}.row .d b{font-size:.85rem}.row .tp{font-size:.9rem}.banner .pill,.banner .by{font-size:.8rem}}
.card{background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.wrap{text-shadow:0 1px 8px rgba(0,0,0,.45)}
header{border-bottom:1px solid var(--line)!important;padding-inline:0}
select,.refresh{background:none!important;border:0!important;box-shadow:none}
select{padding-inline:0}
select option{background:#0d2137;color:#fff}
.fxbar{border-bottom:1px solid rgba(255,255,255,.1)!important;padding-inline:0}
.fxbar button{background:none!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0;padding:8px 12px;box-shadow:none!important}
.fxbar button.on{border-bottom-color:var(--gold)!important;color:var(--gold2)}
.live{background:none;border:0;padding:0}
.stats{background:none;border:0;border-top:1px solid var(--line);border-radius:0}
.row{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.1);border-radius:0;padding-inline:0}
.fc h2{padding-bottom:10px;border-bottom:1px solid var(--line)}
.fc,.current{padding-inline:0}
.banner{border:0!important;border-top:1px solid var(--line)!important;box-shadow:none!important}
.banner .pill{background:none;border:0;padding:0}
body{padding-bottom:30px;background:#0d2137}
h1{font-size:clamp(1rem,3.4vw,1.7rem)}.title p{font-size:.72rem}.title .ico{font-size:2.2rem}
.city{font-size:clamp(1.4rem,5vw,2.6rem)}.temp{font-size:clamp(2.2rem,8vw,4.6rem)}
.hero{width:clamp(2.6rem,9vw,5rem);height:clamp(2.6rem,9vw,5rem);font-size:clamp(2.2rem,8vw,4.2rem)}
.desc{font-size:clamp(1rem,3vw,1.3rem)}.date,.feels{font-size:.78rem}
@media(max-width:600px){h1{font-size:1rem}.title p{font-size:.62rem}.title .ico{font-size:1.8rem}.city{font-size:1.5rem}.date,.feels{font-size:.7rem}.temp{font-size:2.3rem}.hero{width:2.6rem;height:2.6rem;font-size:2.2rem}.desc{font-size:1rem}.big{gap:4px}.fxbar .lbl{font-size:.68rem}.fxbar button{font-size:.7rem;padding:6px 9px}.stat .i{font-size:1rem}.stat .t{font-size:.6rem}.stat .v{font-size:.62rem}.fc h2{font-size:.9rem}.row .d b{font-size:.78rem}.row .d span{font-size:.65rem}.row .ic{font-size:1.3rem;width:30px}.row .tp{font-size:.8rem}.note,.banner .pill,.banner .by{font-size:.7rem}select{font-size:.75rem}}
@media(max-width:700px){
body{padding:3vw 3.5vw 4vw}.wrap{gap:2vw}
header{padding:0 0 2.5vw;gap:2vw}.title{width:100%;gap:2vw}.title .ico{font-size:8vw}
h1{font-size:4.6vw}.title p{font-size:2.6vw;margin-top:.5vw}
.ctrl{width:100%;gap:2vw}select{font-size:3vw;min-width:0;flex:1;padding:1.5vw 0}.refresh{width:7vw;height:7vw;font-size:4.5vw;padding:0}
.fxbar{flex-wrap:wrap;overflow:visible;gap:.5vw 1.5vw;padding:1.5vw 0}.fxbar .lbl{flex-basis:100%;font-size:2.7vw}
.fxbar button{font-size:2.7vw;padding:1.2vw 2vw}
.grid{gap:3vw}.current{padding:2vw 0;min-height:0}.fc{padding:1vw 0}
.live{font-size:2.6vw;gap:1.5vw}.dot{width:2.4vw;height:2.4vw}
.cur-main{gap:2vw;margin:2vw 0}.city{font-size:6.8vw}.date{font-size:2.8vw}
.big{gap:1.5vw}.hero{width:10vw;height:10vw;font-size:9vw}.temp{font-size:9.5vw}
.desc{font-size:4vw}.feels{font-size:2.8vw}
.stats{margin-top:3vw;padding:2.5vw 0}.stat{padding:0 .5vw}.stat .i{font-size:4.5vw}.stat .t{font-size:2.4vw}.stat .v{font-size:2.5vw}
.fc h2{font-size:3.6vw;padding-bottom:2vw;margin-bottom:1vw}
.row{padding:1.6vw 0;gap:2vw;margin:0}.row .ic{font-size:6vw;width:9vw}.row .d b{font-size:3.1vw}.row .d span{font-size:2.5vw}.row .tp{font-size:3.2vw}
.note{font-size:2.5vw;margin-top:2vw}
.banner{padding:3vw 0 1vw}.banner .pill,.banner .by{font-size:3vw}.banner .pill{margin-bottom:1vw}
}
@media(max-width:700px){
body{padding:2.5vw 3vw 3vw}.wrap{gap:1.5vw}
header{padding:0 0 1.8vw;gap:1.5vw}.title{gap:1.5vw}.title .ico{font-size:5.5vw}
h1{font-size:3.3vw}
select{font-size:2.3vw;padding:1vw 0}.refresh{width:5vw;height:5vw;font-size:3.3vw}
.fxbar{padding:1vw 0;gap:.4vw 1vw}.fxbar button{font-size:2vw;padding:.9vw 1.5vw}
.current{padding:1.5vw 0}.live{font-size:2vw}.dot{width:1.8vw;height:1.8vw}
.cur-main{margin:1.5vw 0}.city{font-size:4.4vw}.date{font-size:2.1vw}

.desc{font-size:2.9vw}.feels{font-size:2.1vw}
.stats{margin-top:2vw;padding:1.8vw 0}.stat .i{font-size:3.2vw}.stat .t{font-size:1.8vw}.stat .v{font-size:1.9vw}
.fc h2{font-size:2.6vw;padding-bottom:1.4vw}
.row{padding:1.1vw 0}.row .ic{font-size:4.2vw;width:6.5vw}.row .d b{font-size:2.3vw}.row .d span{font-size:1.9vw}.row .tp{font-size:2.4vw}
.note{font-size:1.9vw;margin-top:1.4vw}
.banner .pill,.banner .by{font-size:2.3vw}

<body data-fx="sunny">
<canvas id="fx"></canvas>

<div class="wrap">
  <header class="card">
    <div class="title"><div class="ico">🌤️</div><div><h1>طقس الشرقاط المباشر</h1></div></div>
    <div class="ctrl">
      <button class="refresh" id="ref" title="تحديث البيانات">↻</button>
    </div>
  </header>

  <div class="grid">
    <aside class="card fc">
      <h2>📅 توقعات الـ 5 أيام القادمة</h2>
      <div id="fcList"></div>
      <div class="note">🕒 تتحدث البيانات تلقائياً كل 10 دقائق</div>
    </aside>
    <section class="card current">
      <div>
        <span class="live"><span class="dot" id="liveDot"></span> <span id="liveTxt">تحديث مؤشر الآن</span></span>
        <div class="cur-main">
          <div><h2 class="city" id="cityName">الشرقاط</h2><div class="date" id="date"></div></div>
          <div class="big"><div class="hero" id="hero"></div><div class="temp" id="temp">--°C</div></div>
        </div>
        <div class="desc" id="desc">...</div>
        <div class="feels" id="feels"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="i">☀️</div><div class="t">مؤشر UV</div><div class="v" id="uv">--</div></div>
        <div class="stat"><div class="i">🧭</div><div class="t">الضغط</div><div class="v" id="pr">--</div></div>
        <div class="stat"><div class="i">💧</div><div class="t">الرطوبة</div><div class="v" id="hu">--</div></div>
        <div class="stat"><div class="i">🌬️</div><div class="t">الرياح</div><div class="v" id="wi">--</div></div>
      </div>
    </section>
  </div>

  <div class="card banner">
    <div class="pill">✦ مرحباً بكم في بوابتنا الشاملة ✦</div>
    <div class="by">تصميم واعداد محمد علي احمد الحطاب الجبوري ✦</div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LAT=35.52,LON=43.25;
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const city="الشرقاط";let S=null,mode="sunny",curKey="";


function wx(c){ // [icon, desc, fx]
 if(c===0)return["☀️","مشمس","sunny"];
 if(c<=2)return["⛅","غائم جزئياً","cloudy"];
 if(c===3)return["☁️","غائم","cloudy"];
 if(c<=48)return["🌫️","ضباب","cloudy"];
 if(c<=57)return["🌦️","رذاذ خفيف","rain"];
 if(c<=67||(c>=80&&c<=82))return["🌧️","فرصة أمطار","rain"];
 if(c<=77)return["❄️","ثلوج","cloudy"];
 return["⛈️","عواصف رعدية","rain"];
}
const uvTxt=u=>u<3?"منخفض":u<6?"معتدل":u<8?"مرتفع":"مرتفع جداً";

const FALLBACK={t:28,f:30,w:14,h:35,p:1015,uv:6,day:1,code:0,daily:[[0,29,16],[2,27,15],[61,23,13],[2,24,14],[0,28,17]],dn:[5,6,0,1,2]};

function fb(){const d=new Date();d.setHours(6,0,0,0);const sr=+d;d.setHours(17,15,0,0);return{...FALLBACK,off:1,cc:15,now0:Date.now(),at:Date.now(),sr,ss:+d}}
async function load(){
 try{
  const base=`latitude=${LAT}&longitude=${LON}&timezone=Asia%2FBaghdad`;
  const [rw,ra]=await Promise.allSettled([
   fetch(`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,cloud_cover,uv_index,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,wind_speed_10m_max,precipitation_probability_max&forecast_days=6`),
   fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${base}&current=dust`)]);
  if(rw.status!=="fulfilled"||!rw.value.ok)throw 0;
  const d=await rw.value.json(),c=d.current,dl=d.daily;
  let dust=0;try{dust=(await ra.value.json()).current.dust||0}catch(e){}
  S={t:Math.round(c.temperature_2m),f:Math.round(c.apparent_temperature),w:Math.round(c.wind_speed_10m),h:c.relative_humidity_2m,p:Math.round(c.pressure_msl),uv:Math.round(c.uv_index),cc:c.cloud_cover,dust,code:c.weather_code,now0:Date.parse(c.time),at:Date.now(),sr:Date.parse(dl.sunrise[0]),ss:Date.parse(dl.sunset[0]),
   daily:[1,2,3,4,5].map(i=>[dl.weather_code[i],Math.round(dl.temperature_2m_max[i]),Math.round(dl.temperature_2m_min[i]),dl.wind_speed_10m_max[i],dl.precipitation_probability_max[i]]),
   dn:[1,2,3,4,5].map(i=>new Date(dl.time[i]+"T12:00:00").getDay())};
 }catch(e){S=S||fb();if(S.off)setTimeout(load,30000)}
 render();
}
function liveFx(){
 if(S.dust>=150||(S.w>=40&&S.h<30))return"dust";
 return wx(S.code)[2];
}
function fi(x){const w=wx(x[0]);if(x[3]>=35&&x[0]<=3)return["🌬️","نشاط للرياح"];if(x[4]>=50&&w[2]!=="rain")return["🌧️","فرصة أمطار"];return w}
function render(){
 $("cityName").textContent=city;
 const n=new Date(S.now0+(Date.now()-S.at));
 $("date").textContent=DAYS[n.getDay()]+"، "+n.getDate()+" "+MONS[n.getMonth()]+" "+n.getFullYear();
 $("temp").textContent=S.t+"°C";
 $("feels").textContent="الحرارة المحسوسة: "+S.f+"°C";
 $("wi").textContent=S.w+" كم/س";$("hu").textContent=S.h+"%";$("pr").textContent=S.p+" hPa";
 $("uv").textContent=S.uv+" ("+uvTxt(S.uv)+")";
 $("fcList").innerHTML=S.daily.map((x,i)=>{const w=fi(x);
  return `<div class="row"><div class="ic">${w[0]}</div><div class="d"><b>${DAYS[S.dn[i]]}</b><span>${w[1]}</span></div><div class="tp"><span class="hi">${x[1]}°</span> / <span class="lo">${x[2]}°</span></div></div>`}).join("");
 $("liveTxt").textContent=S.off?"غير متصل - قيم تقريبية":"تحديث مؤشر الآن";$("liveDot").style.background=S.off?"#999":"";
 setFx(liveFx());
}

function cover(){const c=(S.cc??15)/100;return mode==="dust"?.5:mode==="rain"?Math.max(.9,c):c}
function setFx(fx){
 mode=fx;document.body.dataset.fx=fx;
 const night=sky().a<0,w=wx(S.code);let icon=w[0],desc=w[1];
 if(fx==="dust"){icon="🌪️";desc="عاصفة ترابية"}
 else if(fx==="sunny"){icon=night?"🌙":"☀️";desc=night?(S.t<20?"ليل صاف وبارد":"ليل صاف"):(S.t>=25?"مشمس ودافئ":"مشمس صاف")}
 else if(night&&icon==="⛅")icon="☁️";
 $("desc").textContent=desc;
 $("hero").innerHTML=(fx==="sunny"&&!night)?'<div class="sun"></div>':icon;
 const key=fx+Math.round(cover()*5);if(key!==curKey||!CL.length){curKey=key;initScene()}
}

const cv=$("fx"),cx=cv.getContext("2d");let W=1,H=1,P=[],CL=[],ST=[],flash=0;
const KS=[[-1,[5,10,26],[12,22,52]],[-.25,[10,18,45],[30,40,85]],[0,[60,60,120],[240,130,80]],[.15,[60,110,180],[250,190,120]],[.5,[30,100,180],[130,195,240]],[1,[20,100,190],[150,215,255]]];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),cl01=v=>Math.max(0,Math.min(1,v));
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function pal(a){a=Math.max(-1,Math.min(1,a));let i=0;while(i<KS.length-2&&a>KS[i+1][0])i++;const k0=KS[i],k1=KS[i+1],t=(a-k0[0])/(k1[0]-k0[0]);return[mix(k0[1],k1[1],t),mix(k0[2],k1[2],t)]}
function sky(ignore){
 const now=S.now0+(Date.now()-S.at),f=(now-S.sr)/(S.ss-S.sr);
 let a,day=f>=0&&f<=1,pos=f;
 if(day)a=Math.sin(Math.PI*f);
 else{const nl=(S.sr+864e5)-S.ss;pos=cl01(f>1?(now-S.ss)/nl:(now-(S.ss-864e5))/nl);a=-Math.sin(Math.PI*pos)}
 return{a,day,pos};
}
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function initScene(){
 size();P=[];
 const n={rain:260,dust:150}[mode]||0;
 for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,s:Math.random(),r:Math.random()});
 ST=[];for(let i=0;i<170;i++)ST.push({x:Math.random()*W,y:Math.random()*H*.7,s:Math.random(),r:Math.random()*20});
 CL=[];const k=Math.round(2+cover()*9);
 for(let i=0;i<k;i++){const sc=.6+Math.random()*1.1,m=7+Math.floor(Math.random()*5),pf=[];
  for(let j=0;j<m;j++){const u=j/(m-1)-.5;pf.push({dx:u*190*sc+(Math.random()-.5)*26,dy:(Math.random()-.5)*16*sc-(1-Math.abs(u)*2)*20*sc,r:(32+Math.random()*28)*sc*(1-Math.abs(u)*.5)})}
  CL.push({x:Math.random()*(W+500)-250,y:H*(.05+Math.random()*.5),v:.12+Math.random()*.3,pf})}
}
function draw(t){
 const{a,day,pos}=sky(),cov=cover();
 let[top,bot]=pal(a);
 const gray=mode==="rain"?.7:mode==="cloudy"?.45:0,lum=(top[0]+top[1]+top[2])/3;
 if(gray){top=mix(top,[lum*.8,lum*.85,lum*.95],gray);bot=mix(bot,[lum*1.15,lum*1.2,lum*1.25],gray)}
 if(mode==="dust"){top=mix(top,[150,100,50],.55);bot=mix(bot,[220,160,90],.65)}
 const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 const sa=cl01(-a*3)*(1-cov*.75);
 if(sa>0)ST.forEach(s=>{cx.fillStyle=`rgba(255,255,255,${sa*(.3+.7*Math.abs(Math.sin(t/900+s.r)))})`;cx.beginPath();cx.arc(s.x,s.y,.5+s.s*1.2,0,7);cx.fill()});
 const hy=H*.7,px=W*(.12+.76*pos),py=hy-Math.sin(Math.PI*pos)*H*.48,vis=1-cov*.6;
 if(day){
  const warm=cl01(1-a*3),c=mix([255,245,205],[255,140,60],warm);
  let g=cx.createRadialGradient(px,py,0,px,py,H*.55);g.addColorStop(0,rgb(c,.55*vis));g.addColorStop(.25,rgb(c,.2*vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.fillRect(0,0,W,H);
  g=cx.createRadialGradient(px,py,0,px,py,38);g.addColorStop(0,rgb([255,255,240],vis));g.addColorStop(.7,rgb(c,vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.beginPath();cx.arc(px,py,38,0,7);cx.fill();
 }else{
  let g=cx.createRadialGradient(px,py,0,px,py,H*.3);g.addColorStop(0,`rgba(190,205,255,${.3*vis})`);g.addColorStop(1,"rgba(190,205,255,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.globalAlpha=vis;cx.fillStyle="#f1f1e6";cx.beginPath();cx.arc(px,py,26,0,7);cx.fill();
  cx.fillStyle="rgba(150,150,140,.35)";[[-8,-6,6],[7,4,8],[-4,11,4],[10,-9,3.5]].forEach(q=>{cx.beginPath();cx.arc(px+q[0],py+q[1],q[2],0,7);cx.fill()});cx.globalAlpha=1;
 }
 let cc=mix([70,80,120],[255,255,255],cl01((a+.3)/.8));
 const tw=cl01(1-Math.abs(a-.05)/.25);cc=mix(cc,[255,185,150],tw*.6);
 if(gray)cc=mix(cc,[110,120,138],gray);
 if(mode==="dust")cc=mix(cc,[215,165,100],.6);
 const al=.5+.35*cov;
 CL.forEach(c=>{c.x+=c.v;if(c.x>W+260)c.x=-260;
  c.pf.forEach(q=>{const x=c.x+q.dx,y=c.y+q.dy,g=cx.createRadialGradient(x,y,0,x,y,q.r);
   g.addColorStop(0,rgb(cc,al));g.addColorStop(.55,rgb(cc,al*.55));g.addColorStop(1,rgb(cc,0));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,q.r,0,7);cx.fill()})});
 if(mode==="dust"){cx.fillStyle="rgba(200,140,70,.18)";cx.fillRect(0,0,W,H);
  P.forEach(p=>{cx.fillStyle=`rgba(210,150,80,${.15+p.s*.3})`;cx.beginPath();cx.ellipse(p.x,p.y,10+p.r*26,1.5+p.r*2.5,0,0,7);cx.fill();p.x-=3+p.s*7;p.y+=Math.sin(t/700+p.r*9)*.6;if(p.x<-40){p.x=W+40;p.y=Math.random()*H}})}
 if(mode==="rain"){
  cx.strokeStyle="rgba(190,220,255,.5)";cx.lineWidth=1.2;cx.beginPath();
  P.forEach(p=>{cx.moveTo(p.x,p.y);cx.lineTo(p.x-3,p.y+14+p.s*10);p.y+=9+p.s*9;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W}});cx.stroke();
  if(Math.random()<.0025)flash=1;
  if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,W,H);flash-=.06}
 }
}
function loop(t){if(S)draw(t);requestAnimationFrame(loop)}
addEventListener("resize",initScene);

$("ref").addEventListener("click",()=>{const r=$("ref");r.classList.add("spin");setTimeout(()=>r.classList.remove("spin"),600);load()});

load();requestAnimationFrame(loop);
setInterval(load,10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
