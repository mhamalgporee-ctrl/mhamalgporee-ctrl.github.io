<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المس الإطار الذهبي وشاهد رأي الناس فيك</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg-red: #660000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a0202;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Navigation Link to Home */
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(255, 215, 0, 0.1);
            width: fit-content;
            margin-bottom: 5px;
        }

        /* FB Bar Header Style */
        .fb-header {
            background-color: #242526;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .fb-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fb-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #444;
            object-fit: cover;
        }

        .fb-info h4 {
            font-size: 15px;
            color: #e4e6eb;
            font-weight: 700;
        }

        .fb-info span {
            font-size: 12px;
            color: #b0b3b8;
        }

        /* Main Game Card */
        .game-card {
            position: relative;
            background: radial-gradient(circle, #8b0000 0%, #4a0000 100%);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 2px solid #b38728;
            overflow: hidden;
        }

        /* Pattern Overlay */
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#d4af37 0.75px, transparent 0.75px);
            background-size: 12px 12px;
            opacity: 0.15;
            pointer-events: none;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Golden Frame Container */
        .frame-wrapper {
            position: relative;
            width: 220px;
            height: 280px;
            margin: 0 auto 20px auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .frame-wrapper:hover {
            transform: scale(1.02);
        }

        /* Outer Frame Border */
        .golden-frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 16px solid transparent;
            border-image: var(--gold-gradient) 1;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
            z-index: 2;
            pointer-events: none;
        }

        /* Golden Ornaments (Corners) */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            background: var(--gold-gradient);
            z-index: 3;
            pointer-events: none;
        }

        .top-left { top: -8px; left: -8px; clip-path: polygon(0 0, 100% 0, 0 100%); }
        .top-right { top: -8px; right: -8px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
        .bottom-left { bottom: -8px; left: -8px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
        .bottom-right { bottom: -8px; right: -8px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }

        .photo-container {
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .user-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tap-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 4;
            transition: opacity 0.3s;
        }

        .tap-icon {
            font-size: 32px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Results Box */
        .result-box {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
        }

        .user-name {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .opinion-text {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Controls Area */
        .controls {
            background: #242526;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #3a3b3c;
            background: #3a3b3c;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #f7b928;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-upload {
            background: #3a3b3c;
            color: #e4e6eb;
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 900;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(187, 135, 40, 0.4);
        }

        .btn-save {
            background: #2e7d32;
            color: #fff;
            width: 100%;
        }

        #file-input {
            display: none;
        }

        /* Footer Interaction Bar */
        .fb-interactions {
            background: #242526;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #b0b3b8;
        }

        .reactions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .reaction-icons {
            display: flex;
            margin-left: 5px;
        }

        .icon-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            margin-right: -4px;
            border: 2px solid #242526;
        }

        .like { background: #1877f2; }
        .heart { background: #f02849; }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- زر العودة للصفحة الرئيسية -->
    <a href="index.html" class="nav-back">🏠 العودة للرئيسية</a>

    <!-- FB Header Simulation -->
    <div class="fb-header">
        <div class="fb-user">
            <img src="https://picsum.photos/100/100?random=1" class="fb-avatar" alt="User">
            <div class="fb-info">
                <h4>محمد بن سعدون</h4>
                <span>١ ي · 🌐</span>
            </div>
        </div>
        <div style="color: #b0b3b8; font-size: 20px;">•••</div>
    </div>

    <!-- Main Game Card (Captured for Image) -->
    <div class="game-card" id="capture-area">
        <div class="title">المس الإطار الذهبي للصورة وشاهد رأي الناس فيك؟</div>

        <div class="frame-wrapper" id="gold-frame" onclick="revealOpinion()">
            <div class="golden-frame"></div>
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <div class="photo-container">
                <img id="user-img" class="user-photo" src="https://picsum.photos/300/400?random=2" alt="الصورة">
                <div class="tap-overlay" id="tap-overlay">
                    <span class="tap-icon">👆</span>
                    <span style="font-weight: 700; font-size: 14px;">إلمس الإطار هنا</span>
                </div>
            </div>
        </div>

        <div class="result-box">
            <div class="user-name" id="display-name">محمد</div>
            <div class="opinion-text" id="display-text">اضغط على الإطار أعلاه لمعرفة رأي الناس فيك!</div>
        </div>
    </div>

    <!-- Controls Area -->
    <div class="controls">
        <div class="input-group">
            <input type="text" id="name-input" placeholder="اكتب اسمك هنا (اختياري)" oninput="updateName()">
            <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">
                📷 تغيير الصورة
            </button>
            <input type="file" id="file-input" accept="image/*" onchange="loadUserPhoto(event)">
        </div>

        <button class="btn btn-gold" onclick="revealOpinion()">✨ اكشف النتيجة الآن</button>
        <button class="btn btn-save hidden" id="save-btn" onclick="saveAsImage()">📥 حفظ بطاقة النتيجة</button>
    </div>

    <!-- FB Reactions Bar Simulation -->
    <div class="fb-interactions">
        <div class="reactions">
            <div class="reaction-icons">
                <div class="icon-circle like">👍</div>
                <div class="icon-circle heart">❤️</div>
            </div>
            <span>أبو فراس وام ١٢8 من الأصدقاء</span>
        </div>
        <div>اضغط للعب ⚡ AHA</div>
    </div>

</div>

<script>
    const opinions = [
        "شخص يساعد الجميع ، اللهم بارك فيه وارزقه كل ما يتمني في الدنيا والأخرة",
        "إنسان طيب القلب، صاحب ابتسامة دائمة ونفس زكية يُحبها الجميع ❤️",
        "شخصية قيادية وقوية، كلمته واحدة ويتمتع باحترام ومحبة كل من يعرفه ✨",
        "صاحب واجب وأصل طيب، لا يتخلى عن صديق ونيته دائماً صافية 🌟",
        "عزيز النفس، كريم الخُلق، والدعوات الجميلة تترافقه أينما ذهب 🤲",
        "شخص مخلص وسند حقيقي، يعطي دون مقابل وقلبه أبيض كالثلج 💎",
        "هادئ الطباع، حكيم في تصرفاته، ومحبوك جداً بين أهله وأصدقائه 👑"
    ];

    function updateName() {
        const inputVal = document.getElementById('name-input').value.trim();
        document.getElementById('display-name').innerText = inputVal !== "" ? inputVal : "محمد";
    }

    function loadUserPhoto(event) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('user-img').src = reader.result;
        }
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function revealOpinion() {
        document.getElementById('tap-overlay').classList.add('hidden');

        const randomIndex = Math.floor(Math.random() * opinions.length);
        const selectedOpinion = opinions[randomIndex];

        const textElem = document.getElementById('display-text');
        textElem.style.opacity = 0;
        
        setTimeout(() => {
            textElem.innerText = selectedOpinion;
            textElem.style.opacity = 1;
            document.getElementById('save-btn').classList.remove('hidden');
        }, 200);

        confetti({
            particleCount: 70,
            spread: 60,
            origin: { y: 0.6 }
        });
    }

    function saveAsImage() {
        const captureArea = document.getElementById('capture-area');
        
        html2canvas(captureArea, {
            scale: 2,
            useCORS: true,
            backgroundColor: null
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'opinion-result.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
