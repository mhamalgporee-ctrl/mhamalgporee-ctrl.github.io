<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#43382e">
<title>رياض الصالحين - الشرقاط الثقافي الأول</title>
<link rel="icon" href="acon.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{--brown:#3a3128;--mid:#6b5a47;--soft:#f5ece1;--ivory:#fcf8f2;--gold:#b8964f;--gold-l:#d9c48f;--line:#e6d6bd;--page:#4f4437;--bar:#43382e;--container:1200px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--soft);font:16px/1.9 Tahoma,Arial,"Noto Sans Arabic",sans-serif}
a{color:inherit;text-decoration:none}
.container{width:min(var(--container),calc(100% - 48px));margin-inline:auto}
.site-header{position:sticky;z-index:100;top:0;background:var(--bar);border-bottom:3px solid var(--gold)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:70px}
.brand{display:inline-flex;align-items:center;gap:12px}
.brand-mark{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-title{color:#fff;font-weight:700;font-size:1.02rem}
.brand-subtitle{color:var(--gold-l);font-size:.72rem}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--soft);font-size:.86rem;font-weight:700}
.nav-links a:hover{color:var(--gold-l)}

.book-container{text-align:center;padding:60px 20px;max-width:800px;margin-inline:auto}
.book-title{font-family:'Aref Ruqaa',serif;font-size:clamp(2.2rem,5vw,3.2rem);color:var(--gold);margin:0 0 15px}
.book-subtitle{color:var(--gold-l);font-size:1.15rem;margin-bottom:35px;line-height:1.8}

.direct-card{padding:40px 30px;border:2px solid var(--gold);border-radius:24px;background:rgba(0,0,0,0.2);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.direct-card p{margin:0 0 25px;font-size:1.05rem;color:var(--soft)}

.btn-large{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border:1px solid var(--gold);border-radius:8px;background:var(--gold);color:#2b1c0c;font-size:1.1rem;font-weight:700;box-shadow:0 4px 15px rgba(184,150,79,0.3);transition:all 0.3s}
.btn-large:hover{background:var(--gold-l);transform:translateY(-2px)}

.site-footer{padding:20px 0;background:var(--bar);border-top:3px solid var(--gold);text-align:center;color:var(--gold-l);font-size:0.85rem;margin-top:60px}
@media(max-width:780px){.nav-links{display:none}}
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="acon.jpg" alt=""></span>
      <span>
        <span class="brand-title">الشرقاط الثقافي الأول</span>
        <span class="brand-subtitle">ذاكرة المكان · حكاية الإنسان</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#library">المكتبة</a>
    </nav>
  </div>
</header>

<main>
  <div class="container book-container">
    <h1 class="book-title">رياض الصالحين</h1>
    <p class="book-subtitle">من كلام سيد المرسلين · للإمام أبي زكريا محيي الدين النووي رحمه الله</p>
    
    <div class="direct-card">
      <p>يمكنكم تصفح وقراءة أحاديث كتاب رياض الصالحين المباركة مباشرة عبر الموسوعة الموثقة:</p>
      <a class="btn-large" href="https://dorar.net/hadith/2" target="_blank" rel="noopener">
        <span>ابدأ القراءة الآن</span>
        <span aria-hidden="true">←</span>
      </a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    جميع الحقوق محفوظة © الشرقاط الثقافي الأول
  </div>
</footer>

</body>
</html>
