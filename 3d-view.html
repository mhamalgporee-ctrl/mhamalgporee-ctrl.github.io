<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>عرض ثلاثي الأبعاد</title>
    <style>
        :root {
            --bg: #1c1712;
            --fg: #f1e6d2;
        }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Noto Naskh Arabic", "Geeza Pro", serif;
            overflow: hidden;
        }
        #c {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }
        #hint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20px;
            text-align: center;
            font-size: 15px;
            opacity: .8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>
    <div id="hint">حرّك إصبعك على الصورة لتدويرها</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.querySelector('#c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const geometry = new THREE.PlaneGeometry(4, 3);
        const material = new THREE.MeshBasicMaterial({ color: 0xb08d57, wireframe: false });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            mesh.rotation.y += deltaX * 0.005;
            mesh.rotation.x += deltaY * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
