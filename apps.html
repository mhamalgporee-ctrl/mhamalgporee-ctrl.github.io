<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التطبيقات | محمد علي الحطاب</title>
    <meta name="description" content="تطبيقات الموبايل والأدوات البرمجية المطورة بواسطة محمد علي الحطاب.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f4f8; color: #333; padding: 20px 15px; direction: rtl; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { font-size: 22px; color: #1e293b; margin-bottom: 15px; text-align: center; }
        .app-item { border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px; }
        .app-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .app-title { font-size: 16px; color: #0f172a; font-weight: bold; margin-bottom: 5px; }
        .app-desc { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .btn { display: inline-block; padding: 8px 16px; background: #10b981; color: #fff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .back-btn { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🤖 التطبيقات والأدوات</h1>
            
            <div class="app-item">
                <div class="app-title">تطبيق استوديو الصور</div>
                <div class="app-desc">تعديل الصور، تفريغ الخلفيات، والتحكم بالألوان بسهولة.</div>
                <a href="#" class="btn">تحميل التطبيق</a>
            </div>

            <div class="app-item">
                <div class="app-title">تطبيق وين موبايلي؟</div>
                <div class="app-desc">العثور على الموبايل المفقود عبر التنبيه الصوتي والفلاش.</div>
                <a href="#" class="btn">تحميل التطبيق</a>
            </div>
        </div>
        <a href="index.html" class="back-btn">⬅ العودة للصفحة الرئيسية</a>
    </div>
</body>
</html>
