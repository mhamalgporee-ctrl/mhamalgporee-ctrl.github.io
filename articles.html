<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>المقالات | محمد علي الحطاب</title>
    <style>

        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { text-decoration: none; color: #10b981; font-weight: bold; font-size: 14px; background: #fff; padding: 8px 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; color: #1e293b; }
        .article-card { background: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .article-title { font-size: 18px; color: #1e293b; margin-bottom: 8px; }
        .article-date { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .article-content { font-size: 14px; color: #475569; line-height: 1.7; }
    </style>
</head>
<body>
    <div class="container">

        </div>

        <!-- مقالة أولى -->
        <div class="article-card">
            <h2 class="article-title">عنوان المقالة الأولى</h2>
            <div class="article-date">تاريخ النشر: سبتمبر 2026</div>
            <p class="article-content">
