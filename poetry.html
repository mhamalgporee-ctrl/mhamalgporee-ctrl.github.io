<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعر شعبي وزهيريات | محمد علي الحطاب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f4f8; color: #333; padding: 20px 15px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { text-decoration: none; color: #10b981; font-weight: bold; font-size: 14px; background: #fff; padding: 8px 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; color: #1e293b; }
        .poem-card { background: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .poem-title { font-size: 18px; color: #10b981; margin-bottom: 12px; }
        .poem-verses { font-size: 15px; color: #334155; line-height: 2; font-weight: 500; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 شعر شعبي وزهيريات</h1>
            <a href="index.html" class="back-btn">← الرئيسية</a>
        </div>

        <!-- قصيدة أو بيت زهيري -->
        <div class="poem-card">
            <h2 class="poem-title">بيت زهيري / قصيدة</h2>
            <div class="poem-verses">اكتب أبيات الشعر الشعبي أو الزهيريات هنا...
كل سطر جديد يظهر مرتباً ومستقلاً تلقائياً.</div>
        </div>
    </div>
</body>
</html>
